name: Release Pixel Music

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/release.jks
            echo "KEYSTORE_PATH=/tmp/release.jks"        >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"  >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS"                  >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD"            >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore /tmp/release.jks -alias pixelmusic \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Pixel Music,O=zlgskt6,C=US" \
              -storepass pixelmusic123 -keypass pixelmusic123 2>/dev/null
            echo "KEYSTORE_PATH=/tmp/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=pixelmusic123"  >> "$GITHUB_ENV"
            echo "KEY_ALIAS=pixelmusic"             >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=pixelmusic123"       >> "$GITHUB_ENV"
            echo "::warning::No KEYSTORE secret set — APK signed with a temporary key."
          fi

      - name: Build Release APK
        shell: bash
        run: ./gradlew assembleRelease --stacktrace --no-daemon --no-configuration-cache
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}

      - name: Sign APK with apksigner (V2/V3 signatures)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-apks
          RAW="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" ! -name "*-signed*" | head -n 1)"
          if [ -z "${RAW:-}" ]; then
            echo "No APK found in app/build/outputs/apk/release:"
            find app/build/outputs/apk -type f -name "*.apk" || true
            exit 1
          fi
          echo "Signing: $RAW"
          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools/" | sort -V | tail -n 1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "release-apks/Pixel-Music-release.apk" \
            "$RAW"
          echo "Signed APK:"
          ls -lh "release-apks/Pixel-Music-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Music-release
          path: release-apks/Pixel-Music-release.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: ver
        run: |
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: tag_check
        run: |
          if git rev-parse "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all APKs
        if: steps.tag_check.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: Pixel-Music-release
          path: release-apks/

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Pixel Music v${{ steps.ver.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: "Pixel Music Release v${{ steps.ver.outputs.version }}"
          files: release-apks/*.apk
